<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>画像検索ツール</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --ink: #18202f;
            --muted: #657086;
            --line: #e5e9f2;
            --surface: #ffffff;
            --surface-soft: #f7f8fc;
            --primary: #6257e8;
            --primary-dark: #4a3fd0;
            --amazon: #ffad22;
        }

        body {
            min-height: 100vh;
            padding: 38px 20px 64px;
            background:
                radial-gradient(circle at 8% 5%, rgba(98, 87, 232, 0.14), transparent 30%),
                radial-gradient(circle at 94% 12%, rgba(55, 176, 138, 0.11), transparent 24%),
                #f3f5fa;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        .container {
            width: min(1180px, 100%);
            margin: 0 auto;
            overflow: hidden;
            border: 1px solid rgba(218, 223, 235, 0.9);
            border-radius: 26px;
            background: var(--surface);
            box-shadow: 0 24px 70px rgba(32, 38, 62, 0.13);
        }

        .hero {
            position: relative;
            overflow: hidden;
            padding: 42px 44px 38px;
            background: linear-gradient(130deg, #1d2340 0%, #343062 58%, #5146b8 100%);
            color: #fff;
        }

        .hero::after {
            position: absolute;
            top: -100px;
            right: -70px;
            width: 290px;
            height: 290px;
            border: 52px solid rgba(255, 255, 255, 0.055);
            border-radius: 50%;
            content: "";
        }

        .eyebrow {
            display: inline-flex;
            align-items: center;
            gap: 7px;
            margin-bottom: 14px;
            padding: 6px 10px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.09);
            color: #dcd9ff;
            font-size: 0.72rem;
            font-weight: 800;
            letter-spacing: 0.08em;
        }

        .hero-content {
            position: relative;
            z-index: 1;
            max-width: 760px;
        }

        h1 {
            margin-bottom: 12px;
            font-size: clamp(1.8rem, 4vw, 2.65rem);
            letter-spacing: -0.025em;
            line-height: 1.15;
        }

        .subtitle {
            max-width: 700px;
            margin-bottom: 21px;
            color: #d7d9e8;
            line-height: 1.65;
        }

        .feature-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            list-style: none;
        }

        .feature-list li {
            padding: 7px 11px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.1);
            color: #f3f2ff;
            font-size: 0.78rem;
            font-weight: 650;
        }

        .workspace {
            padding: 34px 44px 42px;
        }

        .section-label {
            display: flex;
            align-items: center;
            gap: 9px;
            margin-bottom: 12px;
            color: #424b5f;
            font-size: 0.83rem;
            font-weight: 800;
            letter-spacing: 0.025em;
        }

        .step-number {
            display: grid;
            width: 24px;
            height: 24px;
            place-items: center;
            border-radius: 7px;
            background: #eeecff;
            color: var(--primary-dark);
            font-size: 0.72rem;
        }

        .drop-zone {
            display: grid;
            min-height: 196px;
            place-items: center;
            padding: 28px;
            border: 2px dashed #b9b5ea;
            border-radius: 18px;
            background:
                linear-gradient(135deg, rgba(98, 87, 232, 0.055), rgba(55, 176, 138, 0.035)),
                #fbfbfe;
            text-align: center;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .drop-zone:hover,
        .drop-zone.dragover {
            border-color: var(--primary);
            background: #f0efff;
            box-shadow: 0 0 0 5px rgba(98, 87, 232, 0.08);
            transform: translateY(-1px);
        }

        .drop-icon {
            display: grid;
            width: 58px;
            height: 58px;
            margin: 0 auto 14px;
            place-items: center;
            border: 1px solid #dedbff;
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 8px 20px rgba(71, 62, 166, 0.12);
            font-size: 1.75rem;
        }

        .drop-title {
            margin-bottom: 6px;
            color: #272d3d;
            font-size: 1.08rem;
            font-weight: 800;
        }

        .drop-note {
            color: var(--muted);
            font-size: 0.86rem;
        }

        #csvFile {
            display: none;
        }

        .divider {
            display: flex;
            align-items: center;
            gap: 16px;
            margin: 27px 0;
            color: #999;
            font-size: 0.85rem;
        }

        .divider::before,
        .divider::after {
            flex: 1;
            height: 1px;
            background: #e4e4e4;
            content: "";
        }

        label {
            display: block;
            margin-bottom: 9px;
            color: #555;
            font-weight: 600;
        }

        textarea {
            width: 100%;
            min-height: 110px;
            padding: 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            background: #fbfcfe;
            font: inherit;
            font-size: 14px;
            resize: vertical;
            transition: border-color 0.2s;
        }

        textarea:focus {
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 4px rgba(98, 87, 232, 0.08);
            outline: none;
        }

        .button-group {
            display: flex;
            gap: 12px;
            margin-top: 16px;
        }

        button,
        .action-button {
            border: none;
            border-radius: 9px;
            font: inherit;
            font-weight: 700;
            cursor: pointer;
            transition: 0.2s ease;
        }

        .process-btn,
        .clear-btn {
            padding: 13px 24px;
        }

        .process-btn {
            flex: 1;
            background: linear-gradient(135deg, var(--primary), var(--primary-dark));
            color: #fff;
            box-shadow: 0 8px 18px rgba(98, 87, 232, 0.2);
        }

        .clear-btn {
            border: 1px solid var(--line);
            background: #fff;
            color: #5d6678;
        }

        button:hover,
        .action-button:hover {
            transform: translateY(-1px);
            filter: brightness(0.96);
        }

        .status-message {
            display: none;
            margin-top: 22px;
            padding: 12px 16px;
            border-radius: 10px;
            text-align: center;
        }

        .status-message.success {
            display: block;
            border: 1px solid #badbcc;
            background: #d1e7dd;
            color: #0f5132;
        }

        .status-message.error {
            display: block;
            border: 1px solid #f5c2c7;
            background: #f8d7da;
            color: #842029;
        }

        .status-message.info {
            display: block;
            border: 1px solid #b6effb;
            background: #cff4fc;
            color: #055160;
        }

        .results-section {
            display: none;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid var(--line);
        }

        .results-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 18px;
        }

        .result-count {
            padding: 6px 10px;
            border-radius: 999px;
            background: #f0efff;
            color: var(--primary-dark);
            font-size: 0.78rem;
            font-weight: 800;
        }

        .selection-panel {
            display: none;
            grid-template-columns: minmax(0, 1fr) auto;
            gap: 14px;
            margin-bottom: 20px;
            padding: 16px;
            border: 1px solid #dcd8ff;
            border-radius: 14px;
            background: #f8f7ff;
        }

        .selection-panel.visible {
            display: grid;
        }

        .selection-summary {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 9px;
            color: #3f3a76;
            font-size: 0.86rem;
            font-weight: 800;
        }

        .selected-count {
            display: grid;
            min-width: 28px;
            height: 28px;
            padding: 0 7px;
            place-items: center;
            border-radius: 8px;
            background: var(--primary);
            color: #fff;
        }

        .asin-output {
            width: 100%;
            min-height: 88px;
            padding: 11px 12px;
            border: 1px solid #dedcf1;
            border-radius: 10px;
            background: #fff;
            color: #303548;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
            font-size: 0.84rem;
            line-height: 1.5;
            resize: vertical;
        }

        .selection-actions {
            display: flex;
            min-width: 138px;
            flex-direction: column;
            gap: 8px;
            justify-content: flex-end;
        }

        .copy-btn,
        .deselect-btn {
            padding: 11px 14px;
        }

        .copy-btn {
            background: var(--primary);
            color: #fff;
        }

        .deselect-btn {
            border: 1px solid var(--line);
            background: #fff;
            color: #626b7d;
        }

        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
            gap: 20px;
        }

        .product-card {
            display: flex;
            min-width: 0;
            overflow: hidden;
            border: 1px solid var(--line);
            border-radius: 16px;
            background: #fff;
            box-shadow: 0 5px 18px rgba(35, 43, 71, 0.075);
            flex-direction: column;
            transition: 0.22s ease;
        }

        .product-card:hover {
            border-color: #cbc7f2;
            box-shadow: 0 14px 30px rgba(35, 43, 71, 0.13);
            transform: translateY(-3px);
        }

        .product-card.selected {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(98, 87, 232, 0.12), 0 14px 30px rgba(35, 43, 71, 0.13);
        }

        .product-image-wrap {
            position: relative;
            display: grid;
            height: 230px;
            place-items: center;
            padding: 14px;
            border-bottom: 1px solid #eceef4;
            background:
                linear-gradient(45deg, #f6f7fa 25%, transparent 25%),
                linear-gradient(-45deg, #f6f7fa 25%, transparent 25%),
                #fbfbfc;
            background-position: 0 0, 8px 8px;
            background-size: 16px 16px;
        }

        .product-check {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 7px 10px;
            border: 1px solid #dfe2ea;
            border-radius: 10px;
            background: rgba(255, 255, 255, 0.96);
            box-shadow: 0 5px 14px rgba(35, 43, 71, 0.12);
            color: #434b5d;
            font-size: 0.76rem;
            font-weight: 800;
            cursor: pointer;
            z-index: 1;
        }

        .product-check input {
            width: 18px;
            height: 18px;
            margin: 0;
            accent-color: var(--primary);
            cursor: pointer;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .product-body {
            display: flex;
            flex: 1;
            padding: 14px;
            flex-direction: column;
        }

        .product-number {
            margin-bottom: 6px;
            color: #8a92a3;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .product-title {
            display: -webkit-box;
            min-height: 3.9em;
            margin-bottom: 9px;
            overflow: hidden;
            font-size: 0.94rem;
            line-height: 1.3;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 3;
        }

        .asin {
            margin-bottom: 13px;
            color: #778095;
            font-size: 0.78rem;
            font-family: ui-monospace, SFMono-Regular, Consolas, monospace;
        }

        .card-actions {
            display: grid;
            gap: 8px;
            margin-top: auto;
        }

        .action-button {
            display: block;
            width: 100%;
            padding: 11px 10px;
            color: #fff;
            text-align: center;
            text-decoration: none;
        }

        .google-lens-btn {
            background: linear-gradient(135deg, #4f67df, #6554d8);
            box-shadow: 0 6px 14px rgba(79, 103, 223, 0.18);
        }

        .amazon-btn {
            border: 1px solid #f0a019;
            background: linear-gradient(180deg, #ffbd49, var(--amazon));
            color: #25200f;
            box-shadow: 0 6px 14px rgba(255, 153, 0, 0.16);
        }

        .amazon-btn.disabled {
            background: #ddd;
            color: #888;
            cursor: not-allowed;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            body {
                padding: 12px 10px 30px;
            }

            .container {
                border-radius: 18px;
            }

            .hero {
                padding: 30px 20px 26px;
            }

            .workspace {
                padding: 24px 16px 30px;
            }

            .feature-list {
                gap: 6px;
            }

            .drop-zone {
                min-height: 175px;
                padding: 22px 15px;
            }

            .button-group {
                flex-direction: column;
            }

            .results-grid {
                grid-template-columns: 1fr;
            }

            .selection-panel.visible {
                grid-template-columns: 1fr;
            }

            .selection-actions {
                min-width: 0;
                flex-direction: row;
            }

            .selection-actions button {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <header class="hero">
            <div class="hero-content">
                <div class="eyebrow">PRODUCT RESEARCH TOOL</div>
                <h1>画像から商品を、すばやく調査。</h1>
                <p class="subtitle">
                    KeepaのCSVを読み込み、商品画像をまとめて確認。
                    Google Lensでのヨドバシ検索とAmazon商品ページへの移動を、ひとつの画面で行えます。
                </p>
                <ul class="feature-list" aria-label="主な機能">
                    <li>CSVドラッグ＆ドロップ</li>
                    <li>Google Lens検索</li>
                    <li>Amazonへ直接移動</li>
                </ul>
            </div>
        </header>

        <div class="workspace">
            <section>
                <div class="section-label"><span class="step-number">1</span>Keepa CSVを読み込む</div>
                <div class="drop-zone" id="dropZone" role="button" tabindex="0" aria-label="Keepa CSVを選択">
                    <div>
                        <span class="drop-icon">📄</span>
                        <p class="drop-title">複数のCSVファイルをドロップ</p>
                        <p class="drop-note">クリックして複数ファイルを選択することもできます</p>
                    </div>
                </div>
                <input type="file" id="csvFile" accept=".csv,text/csv" multiple>
            </section>

            <div class="divider">または従来の方法</div>

            <section>
                <div class="section-label"><span class="step-number">2</span>画像URLを直接入力</div>
                <label for="urlInput">画像URL（各行セミコロン区切り）</label>
                <textarea
                    id="urlInput"
                    placeholder="https://example.com/image1.jpg;https://example.com/image2.jpg&#10;https://example.com/image3.jpg"
                ></textarea>
                <div class="button-group">
                    <button type="button" class="process-btn" id="processButton">画像を表示する</button>
                    <button type="button" class="clear-btn" id="clearButton">クリア</button>
                </div>
            </section>

            <div class="status-message" id="statusMessage" role="status"></div>

            <section class="results-section" id="resultsSection">
                <div class="results-heading">
                    <h2>商品一覧</h2>
                    <span class="result-count" id="resultCount"></span>
                </div>
                <div class="selection-panel" id="selectionPanel">
                    <div>
                        <div class="selection-summary">
                            <span class="selected-count" id="selectedCount">0</span>
                            <span>選択した商品のASIN</span>
                        </div>
                        <textarea class="asin-output" id="asinOutput" readonly aria-label="選択した商品のASIN"></textarea>
                    </div>
                    <div class="selection-actions">
                        <button type="button" class="copy-btn" id="copyAsinButton">ASINをコピー</button>
                        <button type="button" class="deselect-btn" id="deselectButton">選択を解除</button>
                    </div>
                </div>
                <div class="results-grid" id="resultsGrid"></div>
            </section>
        </div>
    </main>

    <script>
        const dropZone = document.getElementById("dropZone");
        const csvFile = document.getElementById("csvFile");
        const urlInput = document.getElementById("urlInput");
        const processButton = document.getElementById("processButton");
        const clearButton = document.getElementById("clearButton");
        const statusMessage = document.getElementById("statusMessage");
        const resultsSection = document.getElementById("resultsSection");
        const resultsGrid = document.getElementById("resultsGrid");
        const resultCount = document.getElementById("resultCount");
        const selectionPanel = document.getElementById("selectionPanel");
        const selectedCount = document.getElementById("selectedCount");
        const asinOutput = document.getElementById("asinOutput");
        const copyAsinButton = document.getElementById("copyAsinButton");
        const deselectButton = document.getElementById("deselectButton");

        function showStatus(message, type) {
            statusMessage.textContent = message;
            statusMessage.className = `status-message ${type}`;
        }

        function parseCsv(text) {
            const rows = [];
            let row = [];
            let field = "";
            let inQuotes = false;

            for (let i = 0; i < text.length; i++) {
                const char = text[i];

                if (inQuotes) {
                    if (char === '"') {
                        if (text[i + 1] === '"') {
                            field += '"';
                            i++;
                        } else {
                            inQuotes = false;
                        }
                    } else {
                        field += char;
                    }
                } else if (char === '"') {
                    inQuotes = true;
                } else if (char === ",") {
                    row.push(field);
                    field = "";
                } else if (char === "\n") {
                    row.push(field);
                    rows.push(row);
                    row = [];
                    field = "";
                } else if (char !== "\r") {
                    field += char;
                }
            }

            if (field.length > 0 || row.length > 0) {
                row.push(field);
                rows.push(row);
            }

            return rows;
        }

        function normalizeLocale(locale) {
            const value = (locale || "").trim().toLowerCase();
            if (!value || value === "co.jp" || value === "jp") {
                return "co.jp";
            }

            const supportedDomains = new Set([
                "com", "ca", "com.mx", "com.br", "co.uk", "de", "fr",
                "it", "es", "nl", "se", "pl", "com.au", "in"
            ]);
            return supportedDomains.has(value) ? value : "co.jp";
        }

        function amazonUrl(asin, locale) {
            const cleanAsin = (asin || "").trim();
            if (!/^[A-Z0-9]{10}$/i.test(cleanAsin)) {
                return "";
            }
            return `https://www.amazon.${normalizeLocale(locale)}/dp/${encodeURIComponent(cleanAsin)}`;
        }

        function firstImage(imageField) {
            return (imageField || "")
                .split(";")
                .map((url) => url.trim())
                .find(Boolean) || "";
        }

        function productsFromCsv(text) {
            const rows = parseCsv(text.replace(/^\uFEFF/, ""));
            if (rows.length < 2) {
                throw new Error("CSVに商品データがありません。");
            }

            const headers = rows[0].map((header) => header.trim());
            const imageIndex = headers.indexOf("画像");
            const asinIndex = headers.indexOf("ASIN");
            const titleIndex = headers.indexOf("商品名");
            const localeIndex = headers.indexOf("ロケール");

            if (imageIndex === -1 || asinIndex === -1) {
                throw new Error("Keepa CSVの「画像」列または「ASIN」列が見つかりません。");
            }

            return rows.slice(1)
                .filter((row) => row.some((value) => value.trim()))
                .map((row) => ({
                    imageUrl: firstImage(row[imageIndex]),
                    asin: row[asinIndex] || "",
                    title: titleIndex >= 0 ? row[titleIndex] || "" : "",
                    locale: localeIndex >= 0 ? row[localeIndex] || "" : "co.jp"
                }))
                .filter((product) => product.imageUrl);
        }

        function productsFromUrls(text) {
            return text
                .split(/\r?\n/)
                .map((line) => firstImage(line.trim()))
                .filter(Boolean)
                .map((imageUrl, index) => ({
                    imageUrl,
                    asin: "",
                    title: `画像 ${index + 1}`,
                    locale: "co.jp"
                }));
        }

        function deduplicateProductsByAsin(products) {
            const seenAsins = new Set();

            return products.filter((product) => {
                const asin = (product.asin || "").trim().toUpperCase();
                if (!asin) {
                    return true;
                }
                if (seenAsins.has(asin)) {
                    return false;
                }
                seenAsins.add(asin);
                return true;
            });
        }

        function updateAsinSelection() {
            const checkedBoxes = [...resultsGrid.querySelectorAll(".product-select:checked")];
            const asins = checkedBoxes.map((checkbox) => checkbox.value);

            selectedCount.textContent = String(asins.length);
            asinOutput.value = asins.join("\n");
            selectionPanel.classList.toggle("visible", asins.length > 0);

            resultsGrid.querySelectorAll(".product-card").forEach((card) => {
                const checkbox = card.querySelector(".product-select");
                card.classList.toggle("selected", Boolean(checkbox?.checked));
            });
        }

        async function copySelectedAsins() {
            if (!asinOutput.value) {
                return;
            }

            try {
                await navigator.clipboard.writeText(asinOutput.value);
            } catch {
                asinOutput.select();
                document.execCommand("copy");
                window.getSelection()?.removeAllRanges();
            }

            const originalText = copyAsinButton.textContent;
            copyAsinButton.textContent = "コピーしました";
            setTimeout(() => {
                copyAsinButton.textContent = originalText;
            }, 1600);
        }

        function deselectProducts() {
            resultsGrid.querySelectorAll(".product-select:checked").forEach((checkbox) => {
                checkbox.checked = false;
            });
            updateAsinSelection();
        }

        function createProductCard(product, index) {
            const card = document.createElement("article");
            card.className = "product-card";

            const imageWrap = document.createElement("div");
            imageWrap.className = "product-image-wrap";

            if (/^[A-Z0-9]{10}$/i.test(product.asin.trim())) {
                const checkLabel = document.createElement("label");
                checkLabel.className = "product-check";

                const checkbox = document.createElement("input");
                checkbox.className = "product-select";
                checkbox.type = "checkbox";
                checkbox.value = product.asin.trim();
                checkbox.setAttribute("aria-label", `${product.asin.trim()}を選択`);
                checkbox.addEventListener("change", updateAsinSelection);

                const checkText = document.createElement("span");
                checkText.textContent = "選択";
                checkLabel.append(checkbox, checkText);
                imageWrap.appendChild(checkLabel);
            }

            const image = document.createElement("img");
            image.className = "product-image";
            image.src = product.imageUrl;
            image.alt = product.title || `商品 ${index + 1}`;
            image.loading = "lazy";
            image.referrerPolicy = "no-referrer";
            image.onerror = () => {
                image.src = `https://corsproxy.io/?${encodeURIComponent(product.imageUrl)}`;
                image.onerror = () => {
                    image.remove();
                    imageWrap.textContent = "画像を読み込めません";
                };
            };
            imageWrap.appendChild(image);

            const body = document.createElement("div");
            body.className = "product-body";

            const number = document.createElement("div");
            number.className = "product-number";
            number.textContent = `商品 ${index + 1}`;

            const title = document.createElement("h3");
            title.className = "product-title";
            title.textContent = product.title || "商品名なし";
            title.title = product.title || "";

            const asin = document.createElement("div");
            asin.className = "asin";
            asin.textContent = product.asin ? `ASIN: ${product.asin}` : "ASINなし";

            const actions = document.createElement("div");
            actions.className = "card-actions";

            const lensButton = document.createElement("a");
            lensButton.className = "action-button google-lens-btn";
            lensButton.href = `https://lens.google.com/uploadbyurl?url=${encodeURIComponent(product.imageUrl)}&q=${encodeURIComponent("ヨドバシ")}`;
            lensButton.target = "_blank";
            lensButton.rel = "noopener noreferrer";
            lensButton.textContent = "🔍 Google Lens＋ヨドバシ";

            const amazonButton = document.createElement("a");
            const productUrl = amazonUrl(product.asin, product.locale);
            amazonButton.className = `action-button amazon-btn${productUrl ? "" : " disabled"}`;
            amazonButton.textContent = "Amazon";

            if (productUrl) {
                amazonButton.href = productUrl;
                amazonButton.target = "_blank";
                amazonButton.rel = "noopener noreferrer";
            } else {
                amazonButton.setAttribute("aria-disabled", "true");
            }

            actions.append(lensButton, amazonButton);
            body.append(number, title, asin, actions);
            card.append(imageWrap, body);
            return card;
        }

        function renderProducts(products, sourceName) {
            if (products.length === 0) {
                throw new Error("表示できる画像が見つかりませんでした。");
            }

            resultsGrid.replaceChildren();
            updateAsinSelection();
            const fragment = document.createDocumentFragment();
            products.forEach((product, index) => {
                fragment.appendChild(createProductCard(product, index));
            });
            resultsGrid.appendChild(fragment);
            resultCount.textContent = `${products.length}件`;
            resultsSection.style.display = "block";
            showStatus(`${sourceName}から${products.length}件の商品を読み込みました。`, "success");
            resultsSection.scrollIntoView({ behavior: "smooth", block: "start" });
        }

        async function handleCsvFiles(fileList) {
            const files = [...(fileList || [])];
            if (files.length === 0) {
                showStatus("CSVファイルを選択してください。", "error");
                return;
            }

            const invalidFile = files.find((file) => !file.name.toLowerCase().endsWith(".csv"));
            if (invalidFile) {
                showStatus(`${invalidFile.name}はCSVファイルではありません。`, "error");
                return;
            }

            showStatus(`${files.length}個のCSVファイルを読み込んでいます…`, "info");

            try {
                const productGroups = await Promise.all(
                    files.map(async (file) => productsFromCsv(await file.text()))
                );
                const allProducts = productGroups.flat();
                const uniqueProducts = deduplicateProductsByAsin(allProducts);
                const duplicateCount = allProducts.length - uniqueProducts.length;
                const sourceName = files.length === 1 ? files[0].name : `${files.length}個のCSV`;

                renderProducts(uniqueProducts, sourceName);
                if (duplicateCount > 0) {
                    showStatus(
                        `${sourceName}から${uniqueProducts.length}件の商品を読み込みました（重複ASIN ${duplicateCount}件を統合）。`,
                        "success"
                    );
                }
            } catch (error) {
                showStatus(error.message || "CSVの読み込みに失敗しました。", "error");
            } finally {
                csvFile.value = "";
            }
        }

        function handleManualInput() {
            const products = productsFromUrls(urlInput.value.trim());
            try {
                renderProducts(products, "入力されたURL");
            } catch (error) {
                showStatus(error.message, "error");
            }
        }

        function clearAll() {
            urlInput.value = "";
            csvFile.value = "";
            resultsGrid.replaceChildren();
            updateAsinSelection();
            resultsSection.style.display = "none";
            statusMessage.textContent = "";
            statusMessage.className = "status-message";
        }

        dropZone.addEventListener("click", () => csvFile.click());
        dropZone.addEventListener("keydown", (event) => {
            if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                csvFile.click();
            }
        });
        csvFile.addEventListener("change", () => handleCsvFiles(csvFile.files));

        ["dragenter", "dragover"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropZone.classList.add("dragover");
            });
        });

        ["dragleave", "drop"].forEach((eventName) => {
            dropZone.addEventListener(eventName, (event) => {
                event.preventDefault();
                dropZone.classList.remove("dragover");
            });
        });

        dropZone.addEventListener("drop", (event) => handleCsvFiles(event.dataTransfer.files));
        processButton.addEventListener("click", handleManualInput);
        clearButton.addEventListener("click", clearAll);
        copyAsinButton.addEventListener("click", copySelectedAsins);
        deselectButton.addEventListener("click", deselectProducts);
        urlInput.addEventListener("keydown", (event) => {
            if (event.key === "Enter" && event.ctrlKey) {
                event.preventDefault();
                handleManualInput();
            }
        });
    </script>
</body>
</html>
